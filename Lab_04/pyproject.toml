[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-app"
version = "0.1.0"
description = "Typed object model of a vehicle catalog (laboratory work 4)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0"]
test = ["mypy>=1.10", "pytest>=8.0"]

[project.scripts]
domain-app = "domain_app.main:main"
domain-check = "domain_app.check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"
files = ["src"]
