[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
dynamic = ["version"]
description = "Car catalog: REST API, SQLite persistence, Docker and CI/CD (laboratory work 10)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Кравець Владислав" }]
keywords = ["cars", "catalog", "fastapi", "sqlalchemy", "docker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/OWNER/car-catalog"
Changelog = "https://github.com/OWNER/car-catalog/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
bench = [
    "matplotlib>=3.8",
]
dev = [
    "car-catalog[test,bench]",
    "ruff>=0.14",
    "mypy>=1.8",
    "build>=1.2",
    "twine>=5",
    "pre-commit>=3.7",
]

[project.scripts]
car-catalog = "car_catalog.main:main"
car-catalog-db = "car_catalog.db_main:main"
car-catalog-api = "car_catalog.server:main"

[tool.setuptools.dynamic]
version = { attr = "car_catalog.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
car_catalog = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that exercise several components together",
]
filterwarnings = [
    # starlette's TestClient wording about httpx (harmless, depends on version)
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]

[tool.coverage.run]
branch = true
source = ["car_catalog"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"migrations/**" = ["UP007", "UP035"]
"benchmarks/benchmark.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
