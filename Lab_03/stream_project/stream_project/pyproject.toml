[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-processor"
version = "0.2.0"
description = "Streaming car catalog processing laboratory project"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8.0", "mypy>=1.8"]

[project.scripts]
stream-processor = "stream_processor.main:main"
stream-benchmark = "stream_processor.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
