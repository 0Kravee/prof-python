[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.4.0"
description = "Car catalog with an automated pytest test suite (laboratory work 6)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
]

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "strict"
markers = [
    "integration: tests that exercise several components together",
]

[tool.coverage.run]
branch = true
source = ["car_catalog"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mypy]
python_version = "3.11"
files = ["src"]
