[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.7.0"
description = "Car catalog with database persistence (SQLAlchemy, SQLite, Alembic)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
]
dev = [
    "car-catalog[test]",
    "mypy>=1.8",
    "flake8>=7",
]

[project.scripts]
car-catalog = "car_catalog.main:main"
car-catalog-db = "car_catalog.db_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "strict"
markers = [
    "integration: tests that exercise several components together",
]

[tool.coverage.run]
branch = true
source = ["car_catalog"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mypy]
python_version = "3.11"
files = ["src"]
