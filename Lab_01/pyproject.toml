[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.2.0"
description = "Car catalog laboratory project"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8.0", "mypy>=1.8"]

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
